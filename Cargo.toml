[package]
name        = "sentara-dht22"
version     = "0.2.0"
edition     = "2021"
resolver    = "2"
authors     = ["Vyanda Kartika Fajarina <2042241030@student.its.ac.id>"]
description = "SENTARA: Pemantauan Suhu & Kelembaban Berkeselamatan-Kritis | ESP32-S3 + DHT22 + LCD I2C + 3 LED | ITS 2026"

[dependencies]
esp-idf-svc = { version = "0.48", features = ["experimental"] }
esp-idf-hal  = "0.43"
esp-idf-sys  = { version = "0.34", features = ["binstart"] }
anyhow       = "1"
log          = "0.4"
heapless     = "0.8"

[build-dependencies]
embuild = "0.31"

[[bin]]
name = "sentara-dht22"
path = "src/main.rs"

[profile.release]
opt-level     = "s"
debug         = false
lto           = true
codegen-units = 1

[profile.dev]
debug     = true
opt-level = "z"
